# 一键启动: docker compose up -d --build
# 拉模型:   docker compose exec ollama ollama pull qwen2.5:1.5b
#           docker compose exec ollama ollama pull nomic-embed-text
# 验证:     curl http://localhost:8001/health

services:
  # LLM + Embedding 服务
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # 你的 FastAPI Agent 服务
  rag-agent:
    build: .
    image: rag-agent:1.0
    container_name: rag-agent-api
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8001:8001"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODEL: qwen2.5:1.5b
      EMBEDDING_MODEL: nomic-embed-text
      TEMPERATURE: "0.1"
      RETRIEVAL_MODE: hybrid
      RERANK_ENABLED: "true"
      TOP_K: "5"
      MAX_ITERATIONS: "2"
    volumes:
      # 持久化向量库（重要：重启不丢文档索引）
      - ./chroma_db:/app/chroma_db
      # 上传文件临时目录
      - rag_uploads:/tmp/rag_uploads

volumes:
  ollama_data:
  rag_uploads:
