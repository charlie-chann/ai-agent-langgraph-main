# 仅 API + Redis 的最小演示（Ollama 跑在宿主机，见 README 步骤）
apiVersion: v1
kind: Namespace
metadata:
  name: rag-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-agent-config
  namespace: rag-agent
data:
  APP_ENV: "local"
  LLM_PROVIDER: "ollama"
  EMBEDDING_PROVIDER: "ollama"
  # Docker Desktop / macOS：Pod 访问宿主机上的 Ollama
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  DEFAULT_MODEL: "qwen2.5:1.5b"
  EMBEDDING_MODEL: "nomic-embed-text"
  REDIS_URL: "redis://redis:6379/0"
  CACHE_ENABLED: "true"
  CHECKPOINTER_BACKEND: "memory"
  CONVERSATIONS_BACKEND: "sqlite"
  HITL_ENABLED: "false"
  KG_EXTRACTION_MODE: "rule"
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-agent-secret
  namespace: rag-agent
type: Opaque
stringData:
  JWT_SECRET: "k8s-dev-secret-change-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rag-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rag-agent
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      containers:
        - name: api
          image: rag00-agent:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-agent-config
            - secretRef:
                name: rag-agent-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-agent
spec:
  type: NodePort
  selector:
    app: rag-api
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
